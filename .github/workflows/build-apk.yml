name: Gerar APK do JusSmart

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v3

      - name: Configurar Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Gerar Projeto e Compilar APK
        run: |
          flutter create app_jussmart --org com.jussmart.app
          cd app_jussmart
          if [ -f ../lib/main.dart ]; then cp -f ../lib/main.dart ./lib/main.dart; fi
          if [ -f ../pubspec.yaml ]; then cp -f ../pubspec.yaml ./pubspec.yaml; fi
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../app-release.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v3
        with:
          name: JusSmart-App
          path: app-release.apk
          
