name: Gerar APK do JusSmart

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v3

      - name: Configurar Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Criar estrutura do projeto Flutter
        run: |
          mkdir -p temp_app
          cd temp_app
          flutter create . --org com.jussmart.app --app-name jussmart
          cp -f ../lib/main.dart ./lib/main.dart || true
          cp -f ../pubspec.yaml ./pubspec.yaml || true
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../app-release.apk

      - name: Liberar APK para Download
        uses: actions/upload-artifact@v3
        with:
          name: JusSmart-App
          path: app-release.apk
          
