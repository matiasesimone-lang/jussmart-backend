<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JusSmart - Carteira Processual</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e50ff">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; padding: 16px; min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; }
    .app-card { width: 100%; max-width: 450px; background: #1e293b; border-radius: 24px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #334155; margin-top: 10px; }
    
    .header { text-align: center; margin-bottom: 20px; }
    .logo-badge { display: inline-flex; align-items: center; gap: 8px; background: linear-gradient(135deg, #1e50ff, #00f0ff); padding: 8px 18px; border-radius: 20px; font-weight: bold; font-size: 0.95rem; color: #fff; margin-bottom: 8px; }
    .header h1 { font-size: 1.4rem; color: #fff; }
    .header p { font-size: 0.8rem; color: #94a3b8; margin-top: 2px; }

    .search-box { margin-bottom: 14px; }
    .search-box input { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 12px; color: #fff; font-size: 0.9rem; outline: none; }

    .tabs { display: flex; gap: 4px; background: #0f172a; padding: 4px; border-radius: 12px; margin-bottom: 16px; }
    .tab-btn { flex: 1; padding: 8px 4px; border: none; background: transparent; color: #94a3b8; font-size: 0.75rem; font-weight: 600; border-radius: 8px; cursor: pointer; transition: all 0.2s; }
    .tab-btn.active { background: #1e50ff; color: #fff; }

    .btn-add-main { width: 100%; padding: 12px; background: linear-gradient(135deg, #10b981, #059669); border: none; border-radius: 12px; color: #fff; font-weight: bold; font-size: 0.9rem; cursor: pointer; margin-bottom: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; }

    .card { background: #0f172a; border: 1px solid #334155; border-radius: 16px; padding: 16px; margin-bottom: 12px; position: relative; }
    .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .badge-tj { background: #1e50ff; color: #fff; padding: 3px 8px; border-radius: 6px; font-size: 0.7rem; font-weight: bold; }
    .badge-ativo { background: rgba(16, 185, 129, 0.15); color: #10b981; border: 1px solid #10b981; padding: 3px 8px; border-radius: 6px; font-size: 0.68rem; font-weight: bold; }
    .badge-inativo { background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid #ef4444; padding: 3px 8px; border-radius: 6px; font-size: 0.68rem; font-weight: bold; }
    
    .card-title { font-size: 0.95rem; font-weight: bold; color: #f8fafc; margin-bottom: 4px; }
    .card-num { font-size: 0.85rem; font-weight: 600; color: #00f0ff; margin-bottom: 6px; word-break: break-all; }
    .card-detail { font-size: 0.78rem; color: #94a3b8; margin-bottom: 8px; }
    .card-mov { background: #1e293b; border-left: 3px solid #00f0ff; padding: 8px 10px; border-radius: 8px; font-size: 0.75rem; color: #cbd5e1; margin-bottom: 12px; line-height: 1.4; }

    .card-actions { display: flex; gap: 6px; }
    .btn-action { flex: 1; text-align: center; padding: 9px; font-size: 0.72rem; font-weight: bold; border-radius: 8px; text-decoration: none; cursor: pointer; border: none; display: inline-flex; align-items: center; justify-content: center; gap: 4px; }
    .btn-copy { background: #334155; color: #f8fafc; }
    .btn-access { background: rgba(30, 80, 255, 0.3); border: 1px solid #1e50ff; color: #00f0ff; }
    .btn-delete { background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #ef4444; width: 36px; flex: none; }

    /* Modal Form */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(4px); justify-content: center; align-items: center; padding: 16px; z-index: 999; }
    .modal-content { background: #1e293b; width: 100%; max-width: 400px; border-radius: 20px; padding: 20px; border: 1px solid #334155; }
    .modal-title { font-size: 1.1rem; font-weight: bold; color: #fff; margin-bottom: 14px; text-align: center; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.75rem; color: #94a3b8; margin-bottom: 4px; }
    .form-group input, .form-group select { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #fff; font-size: 0.85rem; outline: none; }
    .modal-btns { display: flex; gap: 8px; margin-top: 16px; }
    .btn-modal { flex: 1; padding: 10px; border-radius: 8px; font-weight: bold; border: none; cursor: pointer; font-size: 0.85rem; }
    .btn-save { background: #10b981; color: #fff; }
    .btn-cancel { background: #334155; color: #94a3b8; }
  </style>
</head>
<body>

<div class="app-card">
  <div class="header">
    <div class="logo-badge">⚖️ JusSmart</div>
    <h1>Central Processual</h1>
    <p>Acompanhamento e Gestão de Processos</p>
  </div>

  <button class="btn-add-main" onclick="abrirModal()">➕ Cadastrar Novo Processo</button>

  <div class="search-box">
    <input type="text" id="filterInput" onkeyup="filtrarLista()" placeholder="🔍 Filtrar por nº, assunto ou vara...">
  </div>

  <div class="tabs">
    <button class="tab-btn active" id="tabTodos" onclick="filtrarAba('TODOS')">Todos (<span id="cntTodos">0</span>)</button>
    <button class="tab-btn" id="tabAtivos" onclick="filtrarAba('ATIVO')">🟢 Ativos (<span id="cntAtivos">0</span>)</button>
    <button class="tab-btn" id="tabInativos" onclick="filtrarAba('INATIVO')">🔴 Inativos (<span id="cntInativos">0</span>)</button>
  </div>

  <div id="listaProcessos"></div>
</div>

<!-- Modal para Adicionar Processo -->
<div class="modal" id="modalForm">
  <div class="modal-content">
    <div class="modal-title">Novo Processo para Acompanhamento</div>
    
    <div class="form-group">
      <label>Número do Processo (20 dígitos)</label>
      <input type="text" id="formNum" placeholder="Ex: 8004080-34.2022.8.05.0146">
    </div>

    <div class="form-group">
      <label>Assunto / Título</label>
      <input type="text" id="formAssunto" placeholder="Ex: Ação de Cobrança / Alimentos">
    </div>

    <div class="form-group">
      <label>Tribunal / Órgão Julgador</label>
      <input type="text" id="formOrgao" placeholder="Ex: 1ª Vara Cível - Juazeiro (TJBA)">
    </div>

    <div class="form-group">
      <label>Situação do Processo</label>
      <select id="formSituacao">
        <option value="ATIVO">🟢 ATIVO (Em andamento)</option>
        <option value="INATIVO">🔴 INATIVO (Arquivado/Finalizado)</option>
      </select>
    </div>

    <div class="form-group">
      <label>Última Movimentação / Anotação</label>
      <input type="text" id="formMov" placeholder="Ex: Aguardando audiência / Despacho">
    </div>

    <div class="modal-btns">
      <button class="btn-modal btn-cancel" onclick="fecharModal()">Cancelar</button>
      <button class="btn-modal btn-save" onclick="salvarNovoProcesso()">Guardar</button>
    </div>
  </div>
</div>

<script>
  let filtroAbaAtual = 'TODOS';

  // Base inicial padrão
  const baseInicial = [
    {
      id: 1,
      numero: "8004080-34.2022.8.05.0146",
      tribunal: "TJBA",
      situacao: "ATIVO",
      assunto: "Exoneração de Alimentos",
      orgaoJulgador: "Vara de Família - Comarca de Juazeiro",
      ultimaMovimentacao: "Concluso para despacho/decisão do Juiz.",
      link: "https://pje.tjba.jus.br/pje/ConsultaPublica/listView.seam"
    },
    {
      id: 2,
      numero: "8003476-44.2020.8.05.0146",
      tribunal: "TJBA",
      situacao: "ATIVO",
      assunto: "Procedimento Comum / FUNPREV",
      orgaoJulgador: "1ª Vara Fazenda Pública - Juazeiro",
      ultimaMovimentacao: "Juntada de petição de manifestação da parte autora.",
      link: "https://pje.tjba.jus.br/pje/ConsultaPublica/listView.seam"
    },
    {
      id: 3,
      numero: "0003373-96.2008.8.05.0146",
      tribunal: "TJBA",
      situacao: "INATIVO",
      assunto: "Execução Contra a Fazenda Pública",
      orgaoJulgador: "Vara da Fazenda Pública - Juazeiro",
      ultimaMovimentacao: "Processo arquivado/finalizado - Precatório expedido.",
      link: "https://pje.tjba.jus.br/pje/ConsultaPublica/listView.seam"
    },
    {
      id: 4,
      numero: "0063666-74.2011.8.05.0001",
      tribunal: "TJBA",
      situacao: "INATIVO",
      assunto: "Ordinária / Gratificações PM",
      orgaoJulgador: "6ª Vara da Fazenda Pública - Salvador",
      ultimaMovimentacao: "Processo findo - Aguardando ordem de pagamento.",
      link: "https://pje.tjba.jus.br/pje/ConsultaPublica/listView.seam"
    }
  ];

  // Carrega do LocalStorage do telemóvel ou inicia com os padrões
  function obterProcessos() {
    const dadosSalvos = localStorage.getItem('jussmart_carteira');
    if (!dadosSalvos) {
      localStorage.setItem('jussmart_carteira', JSON.stringify(baseInicial));
      return baseInicial;
    }
    return JSON.parse(dadosSalvos);
  }

  function guardarProcessos(lista) {
    localStorage.setItem('jussmart_carteira', JSON.stringify(lista));
    renderizarInterface();
  }

  function renderizarInterface() {
    const lista = obterProcessos();
    const termoBusca = document.getElementById('filterInput').value.toLowerCase();
    const container = document.getElementById('listaProcessos');

    // Atualiza Contadores nas Abas
    const qtdTodos = lista.length;
    const qtdAtivos = lista.filter(p => p.situacao === 'ATIVO').length;
    const qtdInativos = lista.filter(p => p.situacao === 'INATIVO').length;

    document.getElementById('cntTodos').innerText = qtdTodos;
    document.getElementById('cntAtivos').innerText = qtdAtivos;
    document.getElementById('cntInativos').innerText = qtdInativos;

    // Filtra lista
    let filtrados = lista.filter(p => {
      const atendeAba = (filtroAbaAtual === 'TODOS') || (p.situacao === filtroAbaAtual);
      const atendeTexto = p.numero.toLowerCase().includes(termoBusca) ||
                           p.assunto.toLowerCase().includes(termoBusca) ||
                           p.orgaoJulgador.toLowerCase().includes(termoBusca);
      return atendeAba && atendeTexto;
    });

    if (filtrados.length === 0) {
      container.innerHTML = `<p style="text-align: center; color: #64748b; font-size: 0.85rem; padding: 20px;">Nenhum processo encontrado nesta categoria.</p>`;
      return;
    }

    let html = '';
    filtrados.forEach(p => {
      const isAtivo = p.situacao === 'ATIVO';
      const badgeClass = isAtivo ? 'badge-ativo' : 'badge-inativo';
      const statusTexto = isAtivo ? '🟢 ATIVO' : '🔴 INATIVO';

      html += `
        <div class="card">
          <div class="card-top">
            <span class="badge-tj">${p.tribunal || 'TJBA'}</span>
            <span class="${badgeClass}">${statusTexto}</span>
          </div>
          <div class="card-title">${p.assunto}</div>
          <div class="card-num">Nº: ${p.numero}</div>
          <div class="card-detail">${p.orgaoJulgador}</div>
          <div class="card-mov">📌 <b>Andamento:</b> ${p.ultimaMovimentacao}</div>
          <div class="card-actions">
            <button class="btn-action btn-copy" onclick="copiarNumero('${p.numero}', this)">📋 Copiar Nº</button>
            <a href="${p.link || 'https://pje.tjba.jus.br/pje/ConsultaPublica/listView.seam'}" target="_blank" class="btn-action btn-access">🔗 Abrir PJe</a>
            <button class="btn-action btn-delete" onclick="removerProcesso(${p.id})">🗑️</button>
          </div>
        </div>
      `;
    });

    container.innerHTML = html;
  }

  function filtrarAba(aba) {
    filtroAbaAtual = aba;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    if (aba === 'TODOS') document.getElementById('tabTodos').classList.add('active');
    if (aba === 'ATIVO') document.getElementById('tabAtivos').classList.add('active');
    if (aba === 'INATIVO') document.getElementById('tabInativos').classList.add('active');
    renderizarInterface();
  }

  function filtrarLista() {
    renderizarInterface();
  }

  function copiarNumero(num, btn) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(num);
    } else {
      const temp = document.createElement('input');
      temp.value = num;
      document.body.appendChild(temp);
      temp.select();
      document.execCommand('copy');
      document.body.removeChild(temp);
    }
    
    const txt = btn.innerHTML;
    btn.innerHTML = '✅ Copiado!';
    btn.style.background = '#059669';
    setTimeout(() => {
      btn.innerHTML = txt;
      btn.style.background = '#334155';
    }, 2000);
  }

  function abrirModal() {
    document.getElementById('modalForm').style.display = 'flex';
  }

  function fecharModal() {
    document.getElementById('modalForm').style.display = 'none';
    limparFormulario();
  }

  function limparFormulario() {
    document.getElementById('formNum').value = '';
    document.getElementById('formAssunto').value = '';
    document.getElementById('formOrgao').value = '';
    document.getElementById('formMov').value = '';
  }

  function salvarNovoProcesso() {
    const num = document.getElementById('formNum').value.trim();
    const assunto = document.getElementById('formAssunto').value.trim() || 'Acompanhamento Judicial';
    const orgao = document.getElementById('formOrgao').value.trim() || 'Tribunal de Justiça';
    const situacao = document.getElementById('formSituacao').value;
    const mov = document.getElementById('formMov').value.trim() || 'Cadastrado no JusSmart';

    if (!num) {
      alert('Por favor, informe pelo menos o número do processo.');
      return;
    }

    const lista = obterProcessos();
    const novoProc = {
      id: Date.now(),
      numero: num,
      tribunal: num.includes('.8.05') ? 'TJBA' : 'PJe',
      situacao: situacao,
      assunto: assunto,
      orgaoJulgador: orgao,
      ultimaMovimentacao: mov,
      link: 'https://pje.tjba.jus.br/pje/ConsultaPublica/listView.seam'
    };

    lista.unshift(novoProc);
    guardarProcessos(lista);
    fecharModal();
  }

  function removerProcesso(id) {
    if (confirm('Deseja remover este processo da sua central de acompanhamento?')) {
      let lista = obterProcessos();
      lista = lista.filter(p => p.id !== id);
      guardarProcessos(lista);
    }
  }

  // Inicializa ao carregar
  window.addEventListener('DOMContentLoaded', renderizarInterface);
</script>

</body>
</html>
