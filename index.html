<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>JusSmart Pro - Gestão e Consulta Processual</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e50ff">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; padding: 12px 12px 80px 12px; min-height: 100vh; display: flex; justify-content: center; }
    .app-card { width: 100%; max-width: 480px; background: #1e293b; border-radius: 20px; padding: 18px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #334155; }
    
    /* Header */
    .header { text-align: center; margin-bottom: 14px; }
    .logo-badge { display: inline-flex; align-items: center; gap: 6px; background: linear-gradient(135deg, #1e50ff, #00f0ff); padding: 6px 14px; border-radius: 16px; font-weight: bold; font-size: 0.88rem; color: #fff; margin-bottom: 4px; }
    .header h1 { font-size: 1.3rem; color: #fff; }
    .header p { font-size: 0.75rem; color: #94a3b8; }

    /* Barra de Navegação Inferior */
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #0f172a; border-top: 1px solid #334155; display: flex; justify-content: space-around; padding: 8px 0; z-index: 900; }
    .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; background: none; border: none; color: #64748b; font-size: 0.68rem; font-weight: 600; cursor: pointer; flex: 1; gap: 3px; }
    .nav-item span.icon { font-size: 1.2rem; }
    .nav-item.active { color: #00f0ff; }

    /* Seções */
    .section-page { display: none; }
    .section-page.active { display: block; }

    /* Componentes Genéricos */
    .search-box { margin-bottom: 10px; }
    .search-box input, .input-std { width: 100%; padding: 11px; background: #0f172a; border: 1px solid #334155; border-radius: 10px; color: #fff; font-size: 0.85rem; outline: none; }
    
    .tabs { display: flex; gap: 4px; background: #0f172a; padding: 3px; border-radius: 10px; margin-bottom: 12px; overflow-x: auto; }
    .tab-btn { flex: 1; padding: 7px 4px; border: none; background: transparent; color: #94a3b8; font-size: 0.72rem; font-weight: 600; border-radius: 7px; cursor: pointer; white-space: nowrap; }
    .tab-btn.active { background: #334155; color: #fff; }

    .btn-add-main { width: 100%; padding: 11px; background: #10b981; border: none; border-radius: 10px; color: #fff; font-weight: bold; font-size: 0.85rem; cursor: pointer; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; gap: 6px; }

    /* Cartão de Processo */
    .card { background: #0f172a; border: 1px solid #334155; border-radius: 14px; padding: 14px; margin-bottom: 10px; }
    .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; flex-wrap: wrap; gap: 4px; }
    .badge { padding: 3px 7px; border-radius: 5px; font-size: 0.65rem; font-weight: bold; text-transform: uppercase; }
    .badge-tj { background: #1e50ff; color: #fff; }
    .badge-ativo { background: rgba(16, 185, 129, 0.15); color: #10b981; border: 1px solid #10b981; }
    .badge-inativo { background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid #ef4444; }
    .badge-tag { background: rgba(0, 240, 255, 0.1); color: #00f0ff; border: 1px solid rgba(0, 240, 255, 0.3); }

    .card-title { font-size: 0.9rem; font-weight: bold; color: #f8fafc; margin-bottom: 3px; }
    .card-num { font-size: 0.82rem; font-weight: 600; color: #00f0ff; margin-bottom: 5px; word-break: break-all; }
    .card-detail { font-size: 0.75rem; color: #94a3b8; margin-bottom: 6px; }
    .card-mov { background: #1e293b; border-left: 3px solid #00f0ff; padding: 7px 9px; border-radius: 6px; font-size: 0.73rem; color: #cbd5e1; margin-bottom: 8px; line-height: 1.3; }
    
    /* Alerta de Prazo no Cartão */
    .prazo-alert { display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: 6px; font-size: 0.7rem; font-weight: bold; margin-bottom: 8px; width: 100%; }
    .prazo-hoje { background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid #ef4444; }
    .prazo-alerta { background: rgba(245, 158, 11, 0.2); color: #f59e0b; border: 1px solid #f59e0b; }
    .prazo-ok { background: rgba(16, 185, 129, 0.15); color: #10b981; border: 1px solid #10b981; }

    /* Ações do Cartão */
    .card-actions { display: flex; gap: 5px; flex-wrap: wrap; }
    .btn-action { flex: 1; min-width: 80px; text-align: center; padding: 8px 4px; font-size: 0.7rem; font-weight: bold; border-radius: 7px; text-decoration: none; cursor: pointer; border: none; display: inline-flex; align-items: center; justify-content: center; gap: 3px; }
    .btn-copy { background: #334155; color: #f8fafc; }
    .btn-access { background: rgba(30, 80, 255, 0.3); border: 1px solid #1e50ff; color: #00f0ff; }
    .btn-wsp { background: rgba(37, 211, 102, 0.2); border: 1px solid #25d366; color: #25d366; }
    .btn-delete { background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #ef4444; width: 32px; flex: none; }

    /* Modal Form */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(4px); justify-content: center; align-items: center; padding: 16px; z-index: 999; }
    .modal-content { background: #1e293b; width: 100%; max-width: 420px; border-radius: 18px; padding: 18px; border: 1px solid #334155; max-height: 90vh; overflow-y: auto; }
    .modal-title { font-size: 1rem; font-weight: bold; color: #fff; margin-bottom: 12px; text-align: center; }
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 0.72rem; color: #94a3b8; margin-bottom: 3px; }
    .form-group input, .form-group select { width: 100%; padding: 9px; background: #0f172a; border: 1px solid #334155; border-radius: 7px; color: #fff; font-size: 0.82rem; outline: none; }
    .modal-btns { display: flex; gap: 8px; margin-top: 14px; }
    .btn-modal { flex: 1; padding: 10px; border-radius: 8px; font-weight: bold; border: none; cursor: pointer; font-size: 0.82rem; }
    .btn-save { background: #10b981; color: #fff; }
    .btn-cancel { background: #334155; color: #94a3b8; }
