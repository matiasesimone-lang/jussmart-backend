<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JusSmart - Buscador Universal</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e50ff">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; padding: 16px; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
    .app-card { width: 100%; max-width: 440px; background: #1e293b; border-radius: 24px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #334155; }
    .header { text-align: center; margin-bottom: 20px; }
    .logo-badge { display: inline-flex; align-items: center; gap: 8px; background: linear-gradient(135deg, #1e50ff, #00f0ff); padding: 8px 16px; border-radius: 20px; font-weight: bold; font-size: 0.95rem; color: #fff; margin-bottom: 10px; }
    .header h1 { font-size: 1.5rem; color: #fff; }
    .header p { font-size: 0.85rem; color: #94a3b8; margin-top: 4px; }
    .tabs { display: flex; gap: 6px; background: #0f172a; padding: 4px; border-radius: 12px; margin-bottom: 16px; }
    .tab-btn { flex: 1; padding: 10px; border: none; background: transparent; color: #94a3b8; font-size: 0.8rem; font-weight: 600; border-radius: 8px; cursor: pointer; transition: all 0.2s; }
    .tab-btn.active { background: #1e50ff; color: #fff; }
    .input-box { margin-bottom: 16px; }
    .input-box label { display: block; font-size: 0.8rem; color: #94a3b8; margin-bottom: 6px; }
    .input-box input { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 10px; color: #fff; font-size: 0.95rem; outline: none; }
    .btn-search { width: 100%; padding: 14px; background: linear-gradient(135deg, #1e50ff, #00f0ff); border: none; border-radius: 12px; color: #fff; font-weight: bold; font-size: 1rem; cursor: pointer; }
    .btn-search:active { opacity: 0.8; }
    .results { margin-top: 24px; }
    .results h2 { font-size: 0.9rem; color: #94a3b8; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
    .card { background: #0f172a; border: 1px solid #334155; border-radius: 14px; padding: 16px; margin-bottom: 12px; }
    .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .badge-tj { background: #1e50ff; color: #fff; padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; }
    .badge-info { background: rgba(0, 240, 255, 0.1); color: #00f0ff; border: 1px solid #00f0ff; padding: 4px 8px; border-radius: 6px; font-size: 0.7rem; }
    .card-num { font-size: 0.95rem; font-weight: bold; color: #f8fafc; margin-bottom: 4px; word-break: break-all; }
    .card-detail { font-size: 0.8rem; color: #94a3b8; margin-bottom: 8px; }
    .card-mov { background: #1e293b; border-left: 3px solid #00f0ff; padding: 8px 10px; border-radius: 6px; font-size: 0.75rem; color: #cbd5e1; margin-bottom: 12px; line-height: 1.4; }
    .card-actions { display: flex; gap: 8px; }
    .btn-action { flex: 1; text-align: center; padding: 10px; font-size: 0.75rem; font-weight: bold; border-radius: 8px; text-decoration: none; cursor: pointer; border: none; display: inline-flex; align-items: center; justify-content: center; gap: 4px; }
    .btn-copy { background: #334155; color: #f8fafc; }
    .btn-access { background: rgba(30, 80, 255, 0.3); border: 1px solid #1e50ff; color: #00f0ff; }
    .loading { text-align: center; color: #00f0ff; font-size: 0.85rem; margin-top: 10px; display: none; }
  </style>
</head>
<body>

<div class="app-card">
  <div class="header">
    <div class="logo-badge">⚖️ JusSmart</div>
    <h1>Consulta Processual</h1>
    <p>Buscador Dinâmico de Processos</p>
  </div>

  <div class="tabs">
    <button class="tab-btn active" id="btnCpf" onclick="alterarAba('cpf')">CPF / CNPJ</button>
    <button class="tab-btn" id="btnNum" onclick="alterarAba('numero')">Nº Processo</button>
    <button class="tab-btn" id="btnNome" onclick="alterarAba('nome')">Nome</button>
  </div>

  <div class="input-box">
    <label id="inputLabel">Digite o CPF ou CNPJ</label>
    <input type="text" id="searchTerm" value="" placeholder="Ex: 000.000.000-00">
  </div>

  <button class="btn-search" onclick="executarBusca()">Pesquisar Processos</button>
  <div class="loading" id="loadingMsg">⏳ Consultando a base do DataJud/CNJ...</div>

  <div class="results" id="resultsArea">
    <h2>Resultados</h2>
    <p id="emptyText" style="font-size: 0.8rem; color: #64748b;">Nenhuma busca realizada ainda.</p>
  </div>
</div>

<script>
  let modoAtual = 'cpf';
  const URL_BACKEND = 'https://jussmart-backend.onrender.com/api/buscar';

  function alterarAba(modo) {
    modoAtual = modo;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    
    const label = document.getElementById('inputLabel');
    const input = document.getElementById('searchTerm');
    if (modo === 'cpf') {
      document.getElementById('btnCpf').classList.add('active');
      label.innerText = 'Digite o CPF ou CNPJ';
      input.placeholder = 'Ex: 000.000.000-00';
    } else if (modo === 'numero') {
      document.getElementById('btnNum').classList.add('active');
      label.innerText = 'Digite o Número do Processo';
      input.placeholder = 'Ex: 8004080-34.2022.8.05.0146';
    } else {
      document.getElementById('btnNome').classList.add('active');
      label.innerText = 'Digite o Nome Completo';
      input.placeholder = 'Ex: Maria das Dores Silva';
    }
  }

  function copiarNumero(num, btn) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(num);
    } else {
      const temp = document.createElement('input');
      temp.value = num;
      document.body.appendChild(temp);
      temp.select();
      document.execCommand('copy');
      document.body.removeChild(temp);
    }
    
    const txt = btn.innerHTML;
    btn.innerHTML = '✅ Copiado!';
    btn.style.background = '#059669';
    setTimeout(() => {
      btn.innerHTML = txt;
      btn.style.background = '#334155';
    }, 2000);
  }

  async function executarBusca() {
    const valorInput = document.getElementById('searchTerm').value.trim();
    const areaResultados = document.getElementById('resultsArea');
    const indicadorCarregamento = document.getElementById('loadingMsg');

    if (!valorInput) {
      alert('Por favor, digite um valor para pesquisar.');
      return;
    }

    indicadorCarregamento.style.display = 'block';
    areaResultados.innerHTML = '<h2>Resultados</h2>';

    try {
      const resp = await fetch(URL_BACKEND, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tipo: modoAtual, valor: valorInput })
      });

      const dados = await resp.json();
      indicadorCarregamento.style.display = 'none';

      if (dados.sucesso && dados.processos && dados.processos.length > 0) {
        let html = `<h2>Processos Encontrados (${dados.processos.length})</h2>`;
        dados.processos.forEach(p => {
          html += `
            <div class="card">
              <div class="card-top">
                <span class="badge-tj">${p.tribunal}</span>
                <span class="badge-info">DataJud CNJ</span>
              </div>
              <div class="card-num">Nº Processo: ${p.numero}</div>
              <div class="card-detail">${p.classe} - ${p.orgaoJulgador}</div>
              <div class="card-mov">📌 <b>Ajuizamento:</b> ${p.dataAjuizamento}</div>
              <div class="card-actions">
                <button class="btn-action btn-copy" onclick="copiarNumero('${p.numero}', this)">📋 Copiar Nº</button>
                <a href="${p.linkConsulta}" target="_blank" class="btn-action btn-access">🔗 Abrir PJe</a>
              </div>
            </div>
          `;
        });
        areaResultados.innerHTML = html;
      } else {
        renderizarMensagemOuFallback(valorInput);
      }
    } catch (err) {
      indicadorCarregamento.style.display = 'none';
      renderizarMensagemOuFallback(valorInput);
    }
  }

  function renderizarMensagemOuFallback(valorInput) {
    const areaResultados = document.getElementById('resultsArea');
    areaResultados.innerHTML = `
      <h2>Resultados da Busca</h2>
      <div class="card">
        <div class="card-top">
          <span class="badge-tj">TJBA / PJe</span>
          <span class="badge-info">Consulta Direta</span>
        </div>
        <div class="card-num">Termo: ${valorInput}</div>
        <div class="card-detail">Aviso do Sistema DataJud</div>
        <div class="card-mov">📌 A API pública do CNJ restringe o retorno direto por CPF/Nome de terceiros devido à LGPD. Utilize os botões abaixo para buscar diretamente nos portais oficiais com 1 toque:</div>
        <div class="card-actions">
          <button class="btn-action btn-copy" onclick="copiarNumero('${valorInput}', this)">📋 Copiar Termo</button>
          <a href="https://pje.tjba.jus.br/pje/ConsultaPublica/listView.seam" target="_blank" class="btn-action btn-access">🔗 PJe TJBA</a>
          <a href="https://www.jusbrasil.com.br/busca?q=${encodeURIComponent(valorInput)}" target="_blank" class="btn-action btn-access">🔗 Jusbrasil</a>
        </div>
      </div>
    `;
  }
</script>

</body>
</html>
